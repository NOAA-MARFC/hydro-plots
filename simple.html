<!DOCTYPE html>
<html>
<head>    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            margin: 0;
            background-color: #f4f4f9;
        }
        
        #header {
            margin-bottom: 20px;
            text-align: center;
        }

        /* Styling for the controls */
        #controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .control-btn {
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #0056b3;
            color: white;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        /* Specific tweaks for the select dropdown */
        select.control-btn {
            padding: 5px 10px 5px 10px;
            appearance: auto;
        }

        .control-btn:hover {
            background-color: #004494;
        }

        .control-btn.toggled-off {
            background-color: #6c757d;
        }

        /* Custom Unified Legend */
        #custom-legend {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #333;
        }

        .legend-line {
            width: 30px;
            height: 0;
            margin-right: 8px;
            border-top-width: 2px;
        }

        .line-obs { border-top-style: solid; border-top-color: rgba(0, 51, 153, 1); }
        .line-short { border-top-style: dashed; border-top-color: rgba(255, 102, 0, 1); }
        .line-med { border-top-style: dotted; border-top-color: rgba(80, 10, 0, 1); }

        /* Chart Grid */
        #charts-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* New class to dynamically center a single chart */
        #charts-wrapper.single-chart {
            grid-template-columns: 1fr;
            max-width: 900px;
            margin: 0 auto;
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
            min-width: 0;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .canvas-wrapper {
            flex-grow: 1;
            position: relative;
            min-height: 0;
        }

        .nwm-warning {
            color: #d9534f;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }

        @media (max-width: 900px) {
            #charts-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- CONTROL PANEL -->
    <div id="controls">
        <button id="toggle-nwm-btn" class="control-btn">Hide NWM Forecast</button>
        <select id="period-select" class="control-btn">
            <option value="1" selected>Show 1-Day Forecast</option>
            <option value="3">Show 3-Day Forecast</option>
            <option value="5">Show 5-Day Forecast</option>
        </select>
    </div>

    <!-- UNIFIED GLOBAL LEGEND -->
    <div id="custom-legend">
        <div class="legend-item"><div class="legend-line line-obs"></div> Observed</div>
        <div class="legend-item nwm-legend"><div class="legend-line line-short"></div> NWM Forecast (Short Range)</div>
        <div class="legend-item nwm-legend"><div class="legend-line line-med"></div> NWM Forecast (Medium Range Mean)</div>
    </div>

    <div id="charts-wrapper"></div>

    <script>
        // --- CONFIGURATION ---
        const NWPS_API_BASE = "https://api.water.noaa.gov/nwps/v1";
        const NWM_API_BASE = "https://api.water.noaa.gov/nwm/v1";

        const urlParams = new URLSearchParams(window.location.search);
        const sitesParam = urlParams.get('sites');

        let siteNumbers = [];
        if (sitesParam) {
            siteNumbers = sitesParam.split(',');
        }

        // --- GLOBAL STATE ---
        const chartInstances = [];
        let isNwmVisible = true;
        let forecastDays = 1;

        // --- EVENT LISTENERS FOR CONTROLS ---
        document.getElementById('toggle-nwm-btn').addEventListener('click', (e) => {
            isNwmVisible = !isNwmVisible;

            e.target.textContent = isNwmVisible ? 'Hide NWM Forecast' : 'Show NWM Forecast';
            e.target.classList.toggle('toggled-off', !isNwmVisible);

            document.querySelectorAll('.nwm-legend').forEach(el => {
                el.style.display = isNwmVisible ? 'flex' : 'none';
            });

            chartInstances.forEach(chart => {
                chart.data.datasets.forEach(dataset => {
                    if (dataset.label.includes('NWM')) {
                        dataset.hidden = !isNwmVisible;
                    }
                });

                if (isNwmVisible) {
                    const maxDate = new Date();
                    maxDate.setDate(maxDate.getDate() + forecastDays);
                    chart.options.scales.x.max = maxDate;
                } else {
                    chart.options.scales.x.max = new Date();
                }

                chart.update();
            });
        });

        document.getElementById('period-select').addEventListener('change', (e) => {
            forecastDays = parseInt(e.target.value, 10);

            if (isNwmVisible) {
                const maxDate = new Date();
                maxDate.setDate(maxDate.getDate() + forecastDays);

                chartInstances.forEach(chart => {
                    chart.options.scales.x.max = maxDate;
                    chart.update();
                });
            }
        });

        // --- RATING CURVE HELPER ---
        async function getRatingCurveInterpolator(siteId) {
            const url = `https://waterdata.usgs.gov/nwisweb/get_ratings?site_no=${siteId}&file_type=exsa`;
            try {
                const response = await fetch(url);
                const textData = await response.text();

                const lines = textData.split('\n');
                const ratingPoints = [];

                for (const line of lines) {
                    if (line.startsWith('#') || line.trim() === '') continue;

                    const columns = line.split('\t');
                    if (isNaN(parseFloat(columns[0]))) continue;

                    const stage = parseFloat(columns[0]);
                    const discharge = parseFloat(columns[2]);

                    if (!isNaN(stage) && !isNaN(discharge)) {
                        ratingPoints.push({ stage, discharge });
                    }
                }

                ratingPoints.sort((a, b) => a.discharge - b.discharge);

                return function(targetDischarge) {
                    if (ratingPoints.length === 0) return null;
                    if (targetDischarge <= ratingPoints[0].discharge) return ratingPoints[0].stage;
                    if (targetDischarge >= ratingPoints[ratingPoints.length - 1].discharge) return ratingPoints[ratingPoints.length - 1].stage;

                    for (let i = 0; i < ratingPoints.length - 1; i++) {
                        const lower = ratingPoints[i];
                        const upper = ratingPoints[i + 1];

                        if (targetDischarge >= lower.discharge && targetDischarge <= upper.discharge) {
                            const dischargeDiff = upper.discharge - lower.discharge;
                            if (dischargeDiff === 0) return lower.stage;
                            const ratio = (targetDischarge - lower.discharge) / dischargeDiff;
                            return lower.stage + (ratio * (upper.stage - lower.stage));
                        }
                    }
                    return null;
                };
            } catch (error) {
                console.error(`Failed to fetch rating curve for site ${siteId}:`, error);
                return null;
            }
        }


        // --- MAIN --

        async function fetchAllSites() {
            const wrapper = document.getElementById('charts-wrapper');

            if (!sitesParam || siteNumbers.length === 0) {
                siteNumbers = ['01570500', '01422747'];
                if(!sitesParam) {
                    const msg = document.createElement('p');
                    msg.style.textAlign = 'center';
                    msg.style.gridColumn = '1 / -1';
                    msg.textContent = 'No sites provided in URL. Showing demo sites.';
                    wrapper.appendChild(msg);
                }
            }

            if (siteNumbers.length === 1) {
                wrapper.classList.add('single-chart');
            }

            for (const siteNo of siteNumbers) {
                try {
                    const interpolator = await getRatingCurveInterpolator(siteNo);

                    // --- FETCH USGS DATA ---
                    let isDischarge = true;

                    // Fetch both parameters
                    let ivUrl = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteNo}&period=P5D&parameterCd=00060,00065`;
                    let response = await fetch(ivUrl);
                    if (!response.ok) throw new Error(`USGS API returned status ${response.status}`);
                    let data = await response.json();

                    if (!data.value || !data.value.timeSeries || data.value.timeSeries.length === 0) {
                        throw new Error("No data returned from USGS.");
                    }

                    const timeSeriesArray = data.value.timeSeries;
                    const dynamicSiteName = timeSeriesArray[0].sourceInfo.siteName;

                    const dischargeSeries = timeSeriesArray.find(series => series.variable.variableCode[0].value === "00060");
                    const stageSeries = timeSeriesArray.find(series => series.variable.variableCode[0].value === "00065");

                    const dischargeValues = (dischargeSeries && dischargeSeries.values[0].value.length > 0) ? dischargeSeries.values[0].value : [];
                    const stageValues = (stageSeries && stageSeries.values[0].value.length > 0) ? stageSeries.values[0].value : [];

                    // Determine what to plot based on ACTUAL data presence
                    isDischarge = dischargeValues.length > 0;

                    if (!isDischarge && stageValues.length === 0) {
                        throw new Error("Neither discharge nor stage data available.");
                    }

                    const usgsPlotData = [];
                    const activeValues = isDischarge ? dischargeValues : stageValues;

                    for (let i = 0; i < activeValues.length; i++) {
                        const item = activeValues[i];
                        const currentTime = new Date(item.dateTime);
                        const val = parseFloat(item.value);

                        if (i > 0) {
                            const prevTime = new Date(activeValues[i - 1].dateTime);
                            const diffMins = (currentTime - prevTime) / (1000 * 60);
                            if (diffMins > 60) usgsPlotData.push({ x: new Date(prevTime.getTime() + 60000), y: null });
                        }
                        usgsPlotData.push({ x: currentTime, y: val });
                    }

                    // --- FETCH NWM FORECAST ---
                    let nwmPlotData = [];
                    let nwmPlotDataMedium = [];
                    let nwmErrorMsg = null;

                    // ONLY fetch and plot NWM if we are plotting Discharge
                    if (isDischarge) {
                        try {
                            const reachId = await getReachIdFromUSGS(siteNo);
                            if (reachId) {
                                const forecastResponse = await getForecastForReach(reachId);

                                if (forecastResponse && forecastResponse.length > 0) {
                                    const cmsToCfs = 35.3147;

                                    const shortRangeData = forecastResponse.find(f => f.configuration === "short_range");
                                    if (shortRangeData && shortRangeData.forecast && shortRangeData.forecast[0].timeseries) {
                                        nwmPlotData = shortRangeData.forecast[0].timeseries.map(pt => ({
                                            x: new Date(pt.valid_datetime),
                                            y: pt.value * cmsToCfs
                                        }));
                                    } else {
                                        nwmErrorMsg = "No short range forecast available.";
                                    }

                                    const mediumRangeData = forecastResponse.find(f => f.configuration === "medium_range_mean");
                                    if (mediumRangeData && mediumRangeData.forecast && mediumRangeData.forecast[0].timeseries) {
                                        nwmPlotDataMedium = mediumRangeData.forecast[0].timeseries.map(pt => ({
                                            x: new Date(pt.valid_datetime),
                                            y: pt.value * cmsToCfs
                                        }));
                                    }
                                } else {
                                     nwmErrorMsg = "No forecast data returned from API.";
                                }
                            } else {
                                nwmErrorMsg = `No NWM reach mapping found.`;
                            }
                        } catch (nwmError) {
                            console.warn(`NWM Fetch failed for ${siteNo}:`, nwmError);
                            nwmErrorMsg = "Failed to load NWM forecast data.";
                        }
                    }

                   
                    const chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    const canvasWrapper = document.createElement('div');
                    canvasWrapper.className = 'canvas-wrapper';
                    const canvas = document.createElement('canvas');
                    canvasWrapper.appendChild(canvas);
                    chartDiv.appendChild(canvasWrapper);

                    if (isDischarge && nwmPlotData.length === 0 && nwmPlotDataMedium.length === 0 && nwmErrorMsg) {
                        const warningDiv = document.createElement('div');
                        warningDiv.className = 'nwm-warning';
                        warningDiv.textContent = nwmErrorMsg;
                        chartDiv.appendChild(warningDiv);
                    }

                    wrapper.appendChild(chartDiv);

                    renderChart(canvas, usgsPlotData, nwmPlotData, nwmPlotDataMedium, dynamicSiteName, siteNo, isDischarge, interpolator);

                } catch (error) {
                    console.error("Error processing site " + siteNo, error);
                    const errDiv = document.createElement('div');
                    errDiv.innerHTML = `<p style="color:red; font-weight:bold; text-align:center;">Error loading ${siteNo}: ${error.message}</p>`;
                    wrapper.appendChild(errDiv);
                }
            }
        }


// --- CHART RENDERING ---
        function renderChart(canvas, usgsData, nwmData, nwmDataMed, siteName, siteNo, isDischarge, interpolator) {
            const ctx = canvas.getContext('2d');
            const usgsColor = isDischarge ? 'rgba(0, 51, 153, 1)' : 'rgba(0, 153, 102, 1)';
            const nwmColor = 'rgba(255, 102, 0, 1)';
            const nwmColorMed = 'rgba(80, 10, 0, 1)';

            const datasets = [
                {
                    label: isDischarge ? `Observed Discharge` : `Observed Stage`,
                    data: usgsData,
                    yAxisID: 'y',
                    borderColor: usgsColor,
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.0,
                    fill: false
                }
            ];

            if (nwmData && nwmData.length > 0) {
                datasets.push({
                    label: 'NWM Forecast (Short Range)',
                    data: nwmData,
                    yAxisID: 'y', // Plotted on primary axis
                    borderColor: nwmColor,
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    tension: 0.0,
                    fill: false,
                    hidden: !isNwmVisible
                });
            }
            if (nwmDataMed && nwmDataMed.length > 0) {
                datasets.push({
                    label: 'NWM Forecast (Medium Range)',
                    data: nwmDataMed,
                    yAxisID: 'y', // Plotted on primary axis
                    borderColor: nwmColorMed,
                    borderWidth: 2,
                    borderDash: [2, 2],
                    pointRadius: 0,
                    tension: 0.0,
                    fill: false,
                    hidden: !isNwmVisible
                });
            }

            const maxDate = new Date();
            if (isNwmVisible) {
                maxDate.setDate(maxDate.getDate() + forecastDays);
            }

            const chart = new Chart(ctx, {
                type: 'line',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d HH:mm'
                            },
                            max: maxDate,
                            title: { display: true, text: 'Date/Time' }
                        },
                        y: {
                            type: isDischarge ? 'logarithmic' : 'linear',
                            position: 'left',
                            title: { display: true, text: isDischarge ? 'Discharge (cfs)' : 'Gage Height (ft)' }
                        },
                        y1: {
                            display: isDischarge && interpolator !== null,
                            type: 'logarithmic', // Must match 'y' exactly to perfectly sync grid lines
                            position: 'right',
                            title: { display: true, text: 'Gage Height (ft)' },
                            grid: { drawOnChartArea: false },
                            afterDataLimits: (scale) => {
                                // Force this axis min/max to visually lock to the Discharge axis
                                const yScale = scale.chart.scales.y;
                                if (yScale) {
                                    scale.min = yScale.min;
                                    scale.max = yScale.max;
                                }
                            },
                            ticks: {
                                callback: function(value) {
                                    // Translate the background Discharge grid value into a Stage label
                                    if (interpolator) {
                                        const stage = interpolator(value);
                                        return stage !== null ? stage.toFixed(2) : '';
                                    }
                                    return value;
                                }
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: [`${siteName}`, `USGS: ${siteNo}`],
                            font: { size: 14 }
                        },
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        // Show base unit
                                        label += context.parsed.y.toFixed(isDischarge ? 0 : 2) + (isDischarge ? ' cfs' : ' ft');

                                        // Append Stage translation if available
                                        if (isDischarge && interpolator) {
                                            const stage = interpolator(context.parsed.y);
                                            if (stage !== null) {
                                                label += ` (${stage.toFixed(2)} ft)`;
                                            }
                                        }
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });

            chartInstances.push(chart);
        }

        // --- NWM HELPER FUNCTIONS ---
        async function getReachIdFromUSGS(usgsId) {
            const response = await fetch(`${NWPS_API_BASE}/gauges/${usgsId}`);
            if (response.status === 404) return null;
            if (!response.ok) throw new Error("NWPS Gauges API Error");

            const data = await response.json();
            return data.reachId || null;
        }

        async function getForecastForReach(reachId) {
            const response = await fetch(`${NWM_API_BASE}/streamflow/forecast/nwm_feature_id/${reachId}/?configuration=short_range&configuration=medium_range_mean&latest=true`);
            if (!response.ok) throw new Error(`NWM API Error: ${response.status}`);
            return await response.json();
        }

        // Start the engine
        fetchAllSites();
    </script>
</body>
</html>
